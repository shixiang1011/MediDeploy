---
- name: Roll back exact Elasticsearch resources owned by this task
  hosts: elasticsearch
  gather_facts: false
  tasks:
    - name: Derive task-owned service and marker
      ansible.builtin.set_fact:
        es_service_name: "spmp-es-{{ spmp_task_id[:8] }}-{{ es_instance_id }}"
        es_service_user: "spmpe{{ (spmp_task_id | regex_replace('-', ''))[:8] }}{{ es_instance_id | regex_replace('[^0-9]', '') }}"
        es_marker_path: "{{ es_config_path }}/.spmp-managed-{{ spmp_task_id }}-{{ es_instance_id }}"
        es_sysctl_file: "/etc/sysctl.d/99-spmp-es-{{ spmp_task_id[:8] }}-{{ es_instance_id }}.conf"

    - name: Verify ownership marker
      ansible.builtin.stat:
        path: "{{ es_marker_path }}"
      register: ownership_marker
      failed_when: false

    - name: Read previous vm.max_map_count value
      ansible.builtin.slurp:
        src: "{{ es_config_path }}/.spmp-vm-max-map-count-before"
      register: previous_max_map_count
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Restore previous vm.max_map_count value
      ansible.builtin.command:
        argv:
          - sysctl
          - -w
          - "vm.max_map_count={{ previous_max_map_count.content | b64decode | trim }}"
      when:
        - ownership_marker.stat.exists | default(false)
        - previous_max_map_count.content is defined
      changed_when: false
      failed_when: false

    - name: Remove exact task-owned sysctl file
      ansible.builtin.file:
        path: "{{ es_sysctl_file }}"
        state: absent
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Find restricted parent directories carrying task ACLs
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import json, os, stat, sys;
            from pathlib import Path;
            parents = set();
            [parents.update(str(parent) for parent in Path(raw).parents if str(parent) != '/')
            for raw in sys.argv[1:]];
            print(json.dumps(sorted(path for path in parents
            if os.path.isdir(path) and not (os.stat(path).st_mode & stat.S_IXOTH))))
          - "{{ es_install_path }}"
          - "{{ es_data_path }}"
          - "{{ es_log_path }}"
          - "{{ es_config_path }}"
      changed_when: false
      failed_when: false
      register: es_restricted_parent_paths
      when: ownership_marker.stat.exists | default(false)

    - name: Revoke this task service user's parent traversal ACLs
      ansible.builtin.command:
        argv:
          - setfacl
          - -x
          - "u:{{ es_service_user }}"
          - "{{ item }}"
      loop: "{{ es_restricted_parent_paths.stdout | default('[]') | from_json }}"
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Stop task-owned Elasticsearch service
      ansible.builtin.systemd_service:
        name: "{{ es_service_name }}"
        state: stopped
        enabled: false
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Stop exact task-owned Elasticsearch processes
      ansible.builtin.command:
        argv:
          - pkill
          - -TERM
          - -u
          - "{{ es_service_user }}"
      when: ownership_marker.stat.exists | default(false)
      changed_when: false
      failed_when: false

    - name: Remove exact task-owned systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ es_service_name }}.service"
        state: absent
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Remove exact task-owned directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ es_install_path }}"
        - "{{ es_data_path }}"
        - "{{ es_log_path }}"
        - "{{ es_config_path }}"
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Remove the task-owned service user without touching home paths
      ansible.builtin.user:
        name: "{{ es_service_user }}"
        state: absent
        remove: false
      when: ownership_marker.stat.exists | default(false)
      failed_when: false

    - name: Reload systemd after rollback
      ansible.builtin.systemd_service:
        daemon_reload: true
      failed_when: false
