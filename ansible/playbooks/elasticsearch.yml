---
- name: Install and start every Elasticsearch node
  hosts: elasticsearch
  gather_facts: false
  any_errors_fatal: true
  roles:
    - elasticsearch

- name: Verify Elasticsearch cluster after every node is ready
  hosts: elasticsearch
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Set the elastic user password through the bootstrap password
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import base64, json, os, sys, time, urllib.request;
            url = os.environ['ES_URL'] + '/_security/user/elastic/_password';
            password = os.environ['ES_PASSWORD'];
            body = json.dumps({'password': password}).encode();
            auth = base64.b64encode(('elastic:' + password).encode()).decode();
            request = urllib.request.Request(url, data=body, method='PUT',
            headers={'Content-Type': 'application/json', 'Authorization': 'Basic ' + auth});
            last = None;
            for _ in range(30):
                try:
                    with urllib.request.urlopen(request, timeout=10) as response:
                        sys.exit(0 if response.status < 300 else 1)
                except Exception as exc:
                    last = exc;
                    time.sleep(5);
            raise SystemExit(str(last))
      environment:
        ES_URL: "http://127.0.0.1:{{ es_http_port }}"
        ES_PASSWORD: "{{ es_elastic_password }}"
      changed_when: false
      no_log: true
      run_once: true
      when: es_security_enabled | bool

    - name: Verify every Elasticsearch HTTP port is reachable
      ansible.builtin.wait_for:
        host: "{{ item.address }}"
        port: "{{ item.http_port }}"
        timeout: 30
      loop: "{{ es_nodes }}"

    - name: Verify Elasticsearch cluster reaches a usable health state
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import base64, json, os, sys, urllib.request;
            url = os.environ['ES_URL'] + '/_cluster/health?wait_for_status=yellow&timeout=60s';
            headers = {};
            if os.environ.get('ES_PASSWORD'):
                auth = base64.b64encode(('elastic:' + os.environ['ES_PASSWORD']).encode()).decode();
                headers['Authorization'] = 'Basic ' + auth;
            request = urllib.request.Request(url, headers=headers);
            with urllib.request.urlopen(request, timeout=75) as response:
                payload = json.load(response);
            status = payload.get('status');
            print(json.dumps({'cluster_name': payload.get('cluster_name'), 'status': status, 'nodes': payload.get('number_of_nodes')}, ensure_ascii=False));
            sys.exit(0 if status in ('yellow', 'green') else 1)
      environment:
        ES_URL: "http://127.0.0.1:{{ es_http_port }}"
        ES_PASSWORD: "{{ es_elastic_password if es_security_enabled | bool else '' }}"
      changed_when: false
      no_log: true
      run_once: true
